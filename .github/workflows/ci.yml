name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '22.12.0'
  NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  NUXT_CLERK_SECRET_KEY: ${{ secrets.NUXT_CLERK_SECRET_KEY }}
  CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run TypeScript compiler
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: npm run test:unit:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build application
        run: npm run build
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: .output/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never cancel a production deploy midway; queue the next one instead
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          # IDs are repository Actions variables (not secrets)
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-version: '50.44.0'
          vercel-args: '--prod --yes'
          github-comment: false

  # Staging: every push to develop becomes a Vercel *preview* deployment (never production),
  # aliased to a stable URL. Feature branches never deploy (Git deployments are off in vercel.json).
  deploy-staging:
    name: Deploy to Vercel (staging)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The staging build migrates only if every DB URL matches STAGING_DATABASE_FINGERPRINT and
      # none matches PRODUCTION_DATABASE_FINGERPRINT (scripts/migrate-deploy.mjs). Stop before
      # deploying if either variable is missing. STAGING may be "pending" for the one-time setup
      # run: the build then refuses and logs the fingerprint to save.
      - name: Require database fingerprints
        env:
          PRODUCTION_DATABASE_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_FINGERPRINT }}
          STAGING_DATABASE_FINGERPRINT: ${{ vars.STAGING_DATABASE_FINGERPRINT }}
        run: |
          if ! [[ "$PRODUCTION_DATABASE_FINGERPRINT" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::Set the repository variable PRODUCTION_DATABASE_FINGERPRINT (see README > Deployment)."
            exit 1
          fi
          if ! [[ "$STAGING_DATABASE_FINGERPRINT" =~ ^([0-9a-f]{16}|pending)$ ]]; then
            echo "::error::Set the repository variable STAGING_DATABASE_FINGERPRINT (see README > Deployment)."
            exit 1
          fi

      - name: Deploy preview to Vercel
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          # IDs are repository Actions variables (not secrets)
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-version: '50.44.0'
          target: preview
          vercel-args: >-
            --yes
            --build-env MIGRATE_STAGING=1
            --build-env PRODUCTION_DATABASE_FINGERPRINT=${{ vars.PRODUCTION_DATABASE_FINGERPRINT }}
            --build-env STAGING_DATABASE_FINGERPRINT=${{ vars.STAGING_DATABASE_FINGERPRINT }}
          github-comment: false
          alias-domains: only-paws-staging.vercel.app
